name: MegaMail Linux native

on:
  push:
    paths:
      - 'apps/megamail/**'
      - 'vendor/gpui-base/**'
      - 'vendor/gpui-pre/**'
      - 'vendor/gpui-pre-wgpu/**'
      - 'vendor/cosmic-text/**'
      - 'crates/mail-core/**'
      - 'crates/zeron-theme/**'
      - 'src/**'
      - 'tools/install-megamail.sh'
      - 'tools/license-inventory.py'
      - 'tools/thunderbird-bridge/**'
      - 'data/megamail.*'
      - '.github/workflows/megamail-native.yml'
  pull_request:
    paths:
      - 'apps/megamail/**'
      - 'vendor/gpui-base/**'
      - 'vendor/gpui-pre/**'
      - 'vendor/gpui-pre-wgpu/**'
      - 'vendor/cosmic-text/**'
      - 'crates/mail-core/**'
      - 'crates/zeron-theme/**'
      - 'src/**'
      - 'tools/install-megamail.sh'
      - 'tools/license-inventory.py'
      - 'tools/thunderbird-bridge/**'
      - 'data/megamail.*'
      - '.github/workflows/megamail-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libglib2.0-dev libdbus-1-dev gettext
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mail-core
            crates/zeron-theme
            apps/megamail
      - name: Check formatting
        run: cargo fmt --manifest-path apps/megamail/Cargo.toml --check
      - name: Check installer syntax
        run: bash -n tools/install-megamail.sh
      - name: Check Thunderbird extension contract
        run: node tools/thunderbird-bridge/extension.test.cjs
      - name: Test portable mail core
        run: cargo test --manifest-path crates/mail-core/Cargo.toml --locked -j 2
      - name: Test Zeron theme model and importer
        run: cargo test --manifest-path crates/zeron-theme/Cargo.toml --locked -j 2
      - name: Test bidi paragraph shaping
        run: cargo test --manifest-path vendor/cosmic-text/Cargo.toml --lib --locked -j 2
      - name: Test wrapped text geometry and caches
        run: cargo test --manifest-path vendor/gpui-pre/Cargo.toml --no-default-features --features test-support --lib text_system::line_layout::tests --locked -j 2
      - name: Test Linux bidi backend
        run: cargo test --manifest-path vendor/gpui-pre-wgpu/Cargo.toml --lib --features test-support cosmic_text_system::tests --locked -j 2
      - name: Test native reader foundation
        run: cargo test --manifest-path vendor/gpui-base/Cargo.toml --lib --locked -j 2
      - name: Test native mailbox and composer
        run: cargo test --manifest-path apps/megamail/Cargo.toml --locked -j 2
      - name: Check native executable
        run: cargo check --manifest-path apps/megamail/Cargo.toml --locked --bin megamail -j 2
