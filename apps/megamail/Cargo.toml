[package]
name = "megamail"
description = "A Linux-first native GPUI Kit email client."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
gpui-kit = "=0.7.1"
megamail-core = { path = "../../crates/mail-core" }
zeron-theme = { path = "../../crates/zeron-theme" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
