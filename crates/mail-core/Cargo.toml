[package]
name = "megamail-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
glib = { version = "0.20", features = ["v2_68"] }
gio = "0.20"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }
rfc2047-decoder = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
siphasher = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
zbus = "4"
ammonia = "4.1.4"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
markup5ever_rcdom = "0.39.0"
html5ever = "0.39"
css-inline = { version = "0.21.2", default-features = false }
roxmltree = "0.20"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
debug = 0
